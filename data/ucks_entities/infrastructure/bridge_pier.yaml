schema: ucks/0.1
sector: infrastructure
domain: structural
entity:
  id: bridge_pier
  name: Bridge Pier
  description: A vertical support structure that transfers deck loads to the foundation.
  parent: structural_element
  property_groups:
  - id: geometric_properties
    name: Geometric Properties
    properties:
    - id: height
      name: Height
      data_type: real
      description: Overall height of the pier from foundation level to deck support
        level.
      unit: m
    - id: cross_section_shape
      name: Cross-Section Shape
      data_type: enum
      description: The shape of the pier's cross-section.
    - id: number_of_columns
      name: Number of Columns
      data_type: integer
      description: The number of individual columns forming the pier.
    - id: diameter
      name: Diameter
      data_type: real
      description: The diameter of the pier, if circular.
      unit: m
    - id: width
      name: Width
      data_type: real
      description: The width of the pier, if rectangular or hammerhead.
      unit: m
  - id: structural_properties
    name: Structural Properties
    properties:
    - id: design_load_capacity
      name: Design Load Capacity
      data_type: real
      description: The maximum axial load capacity of the pier under design conditions.
      unit: kN
  - id: material_properties
    name: Material Type
    properties:
    - id: material_type
      name: Material Type
      data_type: enum
      description: The primary construction material of the pier.
  relationships:
  - type: supports
    target: bridge_deck
    cardinality: one_to_many
    description: The bridge deck element(s) supported by this pier.
  - type: founded_on
    target: foundation_element
    cardinality: one_to_one
    description: The foundation element (e.g., pile cap, spread footing) on which
      the pier is founded.
